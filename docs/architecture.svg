<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/>
    </marker>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #111827; }
      .group-label { font-size: 14px; font-weight: 700; fill: #374151; }
      .box { fill: #FFFFFF; stroke: #D1D5DB; stroke-width: 1.2; }
      .box-title { font-size: 15px; font-weight: 700; fill: #111827; }
      .box-sub { font-size: 12.5px; fill: #4B5563; }
      .flow { fill: none; stroke: #374151; stroke-width: 1.8; marker-end: url(#arrow); }
      .flow-muted { fill: none; stroke: #9CA3AF; stroke-width: 1.6; stroke-dasharray: 6 5; marker-end: url(#arrow-muted); }
      .flow-label { font-size: 12px; fill: #374151; }
      .badge circle { fill: #232F3E; }
      .badge text { font-size: 12px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
      .legend { font-size: 13px; fill: #374151; }
      .legend-head { font-size: 14px; font-weight: 700; fill: #111827; }
    </style>
  </defs>

  <!-- Background (keeps it readable on dark GitHub themes) -->
  <rect width="1400" height="920" fill="#FFFFFF"/>

  <text x="20" y="38" class="title">Serverless Cold-Start Observatory: architecture</text>

  <!-- ===== Groups ===== -->
  <rect x="20" y="62" width="320" height="698" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-dasharray="5 4"/>
  <text x="36" y="86" class="group-label">Developer laptop</text>

  <rect x="380" y="62" width="760" height="698" rx="10" fill="#F5F7FA" stroke="#232F3E" stroke-width="1.4"/>
  <rect x="380" y="62" width="760" height="34" rx="10" fill="#232F3E"/>
  <rect x="380" y="82" width="760" height="14" fill="#232F3E"/>
  <text x="396" y="85" font-size="14" font-weight="700" fill="#FFFFFF">AWS Cloud · eu-north-1 (Stockholm) · SAM stack "observatory"</text>

  <!-- ===== Laptop boxes ===== -->
  <rect x="40" y="105" width="280" height="100" rx="8" class="box"/>
  <rect x="40" y="105" width="6" height="100" rx="3" fill="#6B7280"/>
  <text x="58" y="132" class="box-title">Runner scripts</text>
  <text x="58" y="155" class="box-sub">force_cold.py · strategy.py</text>
  <text x="58" y="175" class="box-sub">idle_gap.py start / stop</text>

  <rect x="40" y="455" width="280" height="100" rx="8" class="box"/>
  <rect x="40" y="455" width="6" height="100" rx="3" fill="#7C3AED"/>
  <text x="58" y="482" class="box-title">ML models (role C)</text>
  <text x="58" y="505" class="box-sub">XGBoost init-time + cold-start models</text>
  <text x="58" y="525" class="box-sub">SHAP · strategy recommender</text>

  <rect x="40" y="640" width="280" height="90" rx="8" class="box"/>
  <rect x="40" y="640" width="6" height="90" rx="3" fill="#6B7280"/>
  <text x="58" y="667" class="box-title">CSV export</text>
  <text x="58" y="690" class="box-sub">export_csv.py → data/*.csv (in git)</text>

  <!-- ===== AWS boxes ===== -->
  <rect x="420" y="170" width="220" height="80" rx="8" class="box"/>
  <rect x="420" y="170" width="6" height="80" rx="3" fill="#E7157B"/>
  <text x="438" y="197" class="box-title">EventBridge Scheduler</text>
  <text x="438" y="220" class="box-sub">one-time schedules</text>

  <rect x="420" y="295" width="220" height="80" rx="8" class="box"/>
  <rect x="420" y="295" width="6" height="80" rx="3" fill="#ED7100"/>
  <text x="438" y="322" class="box-title">Idle-gap Lambda</text>
  <text x="438" y="345" class="box-sub">calls a function, books next</text>
  <text x="438" y="362" class="box-sub">run in 1–40 min</text>

  <rect x="720" y="105" width="280" height="135" rx="8" class="box"/>
  <rect x="720" y="105" width="6" height="135" rx="3" fill="#ED7100"/>
  <text x="738" y="132" class="box-title">Test functions (Lambda) × 44</text>
  <text x="738" y="156" class="box-sub">tiny · web · data · ml</text>
  <text x="738" y="176" class="box-sub">128–2048 MB · x86 / arm64</text>
  <text x="738" y="196" class="box-sub">ZIP · layer · container image</text>
  <text x="738" y="216" class="box-sub">PYTHONPROFILEIMPORTTIME=1</text>

  <rect x="720" y="300" width="280" height="80" rx="8" class="box"/>
  <rect x="720" y="300" width="6" height="80" rx="3" fill="#E7157B"/>
  <text x="738" y="327" class="box-title">CloudWatch Logs</text>
  <text x="738" y="350" class="box-sub">REPORT lines (Init Duration)</text>
  <text x="738" y="368" class="box-sub">+ library import timings</text>

  <rect x="720" y="450" width="280" height="90" rx="8" class="box"/>
  <rect x="720" y="450" width="6" height="90" rx="3" fill="#ED7100"/>
  <text x="738" y="477" class="box-title">Collector (Lambda)</text>
  <text x="738" y="500" class="box-sub">parse log lines · compute cost</text>
  <text x="738" y="520" class="box-sub">write rows + metrics</text>

  <rect x="420" y="600" width="300" height="130" rx="8" class="box"/>
  <rect x="420" y="600" width="6" height="130" rx="3" fill="#4053D6"/>
  <text x="438" y="627" class="box-title">DynamoDB</text>
  <text x="438" y="652" class="box-sub">invocations (one row per call)</text>
  <text x="438" y="673" class="box-sub">import_profiles (library timings)</text>
  <text x="438" y="694" class="box-sub">recommendations (ML output)</text>

  <rect x="860" y="600" width="240" height="90" rx="8" class="box"/>
  <rect x="860" y="600" width="6" height="90" rx="3" fill="#E7157B"/>
  <text x="878" y="627" class="box-title">CloudWatch Metrics</text>
  <text x="878" y="650" class="box-sub">ColdStart · InitDurationMs</text>
  <text x="878" y="670" class="box-sub">ColdStartCostUSD</text>

  <rect x="1170" y="400" width="210" height="110" rx="8" class="box"/>
  <rect x="1170" y="400" width="6" height="110" rx="3" fill="#059669"/>
  <text x="1188" y="427" class="box-title">Grafana dashboard</text>
  <text x="1188" y="450" class="box-sub">Docker on laptop</text>
  <text x="1188" y="470" class="box-sub">localhost:3000</text>
  <text x="1188" y="490" class="box-sub">read-only AWS user</text>

  <!-- ===== Flows ===== -->
  <path d="M320,135 H718" class="flow"/>
  <text x="404" y="127" class="flow-label">update dummy setting, then invoke</text>
  <path d="M530,250 V293" class="flow"/>
  <text x="540" y="276" class="flow-label">triggers</text>
  <path d="M640,335 H680 V215 H718" class="flow"/>
  <text x="646" y="353" class="flow-label">invoke</text>
  <path d="M320,185 H398 V625 H418" class="flow-muted"/>
  <text x="392" y="470" class="flow-label" fill="#6B7280" transform="rotate(-90 392 470)">labels: run_id, package size</text>
  <path d="M860,240 V298" class="flow"/>
  <text x="872" y="274" class="flow-label">log lines</text>
  <path d="M860,380 V448" class="flow"/>
  <text x="872" y="419" class="flow-label">subscription filter</text>
  <path d="M770,540 V570 H600 V598" class="flow"/>
  <text x="640" y="563" class="flow-label">rows</text>
  <path d="M960,540 V598" class="flow"/>
  <text x="978" y="574" class="flow-label">metrics (EMF)</text>
  <path d="M420,705 H322" class="flow"/>
  <path d="M180,640 V557" class="flow"/>
  <text x="198" y="603" class="flow-label">train</text>
  <path d="M320,505 H360 V680 H418" class="flow"/>
  <path d="M1000,340 H1275 V398" class="flow"/>
  <text x="1150" y="332" class="flow-label">Logs Insights</text>
  <path d="M1100,645 H1275 V512" class="flow"/>
  <text x="1150" y="637" class="flow-label">metrics</text>

  <!-- ===== Step badges ===== -->
  <g class="badge"><circle cx="360" cy="135" r="11"/><text x="360" y="135">1</text></g>
  <g class="badge"><circle cx="680" cy="275" r="11"/><text x="680" y="275">1</text></g>
  <g class="badge"><circle cx="845" cy="269" r="11"/><text x="845" y="269">2</text></g>
  <g class="badge"><circle cx="845" cy="414" r="11"/><text x="845" y="414">3</text></g>
  <g class="badge"><circle cx="685" cy="570" r="11"/><text x="685" y="570">4</text></g>
  <g class="badge"><circle cx="960" cy="569" r="11"/><text x="960" y="569">4</text></g>
  <g class="badge"><circle cx="345" cy="705" r="11"/><text x="345" y="705">5</text></g>
  <g class="badge"><circle cx="180" cy="598" r="11"/><text x="180" y="598">6</text></g>
  <g class="badge"><circle cx="360" cy="590" r="11"/><text x="360" y="590">7</text></g>
  <g class="badge"><circle cx="1275" cy="365" r="11"/><text x="1275" y="365">8</text></g>

  <!-- ===== Legend ===== -->
  <text x="20" y="795" class="legend-head">Pipeline steps</text>
  <g class="legend">
    <text x="20" y="822">1  Runner forces a cold start; the idle-gap scheduler calls functions after random waits</text>
    <text x="20" y="845">2  Each function's logs record its startup time and every library's load time</text>
    <text x="20" y="868">3  A subscription filter forwards those log lines to the collector within seconds</text>
    <text x="20" y="891">4  The collector saves one row per call to DynamoDB and publishes metrics</text>
    <text x="720" y="822">5  export_csv.py copies the tables to data/*.csv</text>
    <text x="720" y="845">6  ML models train on the CSVs</text>
    <text x="720" y="868">7  The recommender writes its advice back to DynamoDB</text>
    <text x="720" y="891">8  Grafana charts the metrics and log data</text>
  </g>
  <line x1="1060" y1="800" x2="1100" y2="800" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="1108" y="804" class="legend">data flow</text>
  <line x1="1200" y1="800" x2="1240" y2="800" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-muted)"/>
  <text x="1248" y="804" class="legend">labels</text>
</svg>
